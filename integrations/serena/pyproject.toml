[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ide_bridge"
version = "0.2.7"
description = "JUNON — IDE Bridge integration for Serena, applied without editing Serena"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "IDE Bridge Contributors" },
]
keywords = ["serena", "ide-bridge", "idebp", "mcp"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
# `aenum` is the one hard dependency of the composition layer: Python enums cannot be extended
# any other way, and extending Serena's closed `LanguageBackend` is what makes
# `language_backend: ide_bridge` reachable without editing Serena.
# `websockets` for its **synchronous** client. A Serena tool call is a blocking operation, and an
# async-only client would drag an event loop into a code path that has no use for one. Serena ships
# no websocket library of its own, and the daemon's only RPC door is a WebSocket — see ADR-0036.
# `psutil` for one fact with no portable stdlib source: when the process holding a given pid started.
# `dashboard_registry` records it so a recycled pid cannot pass as a running dashboard. It arrives
# anyway in Serena's own dependency tree, which is exactly why it is named here — this package is
# installed *into* an environment it does not control, and a guarantee resting on someone else's
# transitive dependency is one upstream can drop without ever knowing it was load-bearing.
dependencies = ["aenum>=3.1", "websockets>=13", "psutil>=5.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Composition has to be *run*, and until this existed nothing ran it outside the test suite. A
# separate command rather than a hook into `serena`: what you type says which one you get.
[project.scripts]
junon = "junon.__main__:main"

[project.urls]
Repository = "https://github.com/Zall9/junon"

# --- setuptools config (src-less flat layout) ---

[tool.setuptools.packages.find]
where = ["."]
include = ["ide_bridge*", "junon*"]
exclude = ["tests*"]

# The dashboard is data, not code, and setuptools packages only code unless told otherwise. Without
# this a wheel holds every module and no `index.html`, and JUNON then serves *Serena's* dashboard —
# it does not fail, it renders the wrong page. That survived every release up to 0.2.5 because the
# editable install AGENT_SETUP prescribes reads the checkout directly and never exercises packaging.
[tool.setuptools.package-data]
junon = ["resources/**/*"]

# --- pytest config ---

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "integration: requires a live IDE Bridge daemon (deselected by default)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

# --- Ruff config (optional; used when ruff is available) ---

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
